<form [formGroup]="rapportForm" (ngSubmit)="onSubmit()" class="rapport-form">
  <div class="form-field">
    <label for="titre">Titre</label>
    <input id="titre" formControlName="titre" type="text" required />
  </div>

  <div class="form-field">
    <label for="contenu">Contenu</label>
    <textarea id="contenu" formControlName="contenu" rows="4" required></textarea>
  </div>

  <button type="submit" class="submit-button" [disabled]="!rapportForm.valid">
    Create Report
  </button>
</form>
