<section class="reports-section">
  <h2 class="reports-title">My Reports</h2>
  <div class="create-post-container">
    <button class="create-report-button" (click)="createRapport()">Create New Report</button>
  </div>
  
  <ul class="reports-list">
    <li class="report-item" *ngFor="let rapport of rapports">
      <div class="report-header">
        <div class="user-info">
          <div class="user-avatar">U</div> <!-- Placeholder for user avatar -->
          <div class="user-details">
            <span class="user-name">{{ rapport.nom }}</span> <!-- Placeholder for user name -->
            <span class="post-time">{{ rapport.dateCreation }}</span> <!-- Placeholder for time of report -->
          </div>
        </div>
      </div>
      <div class="report-content">
        <h3 class="report-title">Title: <span class="report-title-value">{{ rapport.titre }}</span></h3>
        <p class="report-description">{{ rapport.contenu }}</p>
      </div>      
      <div class="report-footer">
        <button class="like-button">Like</button>
        <button class="comment-button">Comment</button>
      </div>
    </li>
  </ul>
</section>
